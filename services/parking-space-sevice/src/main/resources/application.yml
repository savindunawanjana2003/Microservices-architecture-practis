server:
  port: 8090

spring:
  application:
    name: parkingspace-sever
  profiles:
    active: default
  config:
    import: "optional:configserver:http://localhost:8089"

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
