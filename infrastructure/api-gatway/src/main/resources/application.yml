spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: Vehicle-service
          uri: lb://Vehicle-service
          predicates:
            - Path=/api/v1/vehicles/**

        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/v1/payments/**
          #        PARKING-SPOT-SERVICE
        - id: parking-spot-service
          uri: lb://parking-spot-service
          predicates:
            - Path=/api/v1/parking/**

        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/v1/user/**

        - id: local-auth-route
          uri: forward:/
          predicates:
            - Path=/api/v1/auth/**

        - id: parkingSpace-service
          uri: lb://parkingSpace-service
          predicates:
            - Path=/api/v1/parkingSpace/**

#          when come the reqest to the back end, firstly come that  in this place after that check the is avelable  relavent path
# if avelable relavet path  then  sent the reqest  to the relavent backend as above includ

#  but firstly the reqest face to the soring  sequrity   after sequryty prosess, now can move to th next step


  #        ===================================s
  #    forward is very important poin this through forwoer the reqest to the Controller of Api-gatway
  # without  forward  the reqest will go to the User microservice
#    ========================================



server:
  port: 8080

logging:
  level:
    org.springframework.cloud.gateway: TRACE
    org.springframework.cloud.loadbalancer: DEBUG
#==================================
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: gateway